[workspace]
resolver = "2"
members = ["crates/*", "desktop"]
default-members = ["desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
reqwest_client = { git = "https://github.com/zed-industries/zed" }

settings = { path = "crates/settings" }
signed_app = { path = "crates/signed_app" }

nostr = { git = "https://github.com/rust-nostr/nostr", features = ["nip59", "nip49", "nip44", "os-rng"] }
nostr-lmdb = { git = "https://github.com/rust-nostr/nostr" }
nostr-blossom = { git = "https://github.com/rust-nostr/nostr" }
nostr-gossip-memory = { git = "https://github.com/rust-nostr/nostr" }
nostr-connect = { git = "https://github.com/rust-nostr/nostr" }
nostr-sdk = { git = "https://github.com/rust-nostr/nostr" }

gix = { version = "0.88", default-features = false, features = ["sha1", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "status"] }

jiff = "0.2"

smol = "2"
futures = "0.3"
flume = { version = "0.11.1", default-features = false, features = ["async", "select"] }
rust-embed = { version = "8.5", features = ["include-exclude"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
log = "0.4"
anyhow = "1.0.44"
webbrowser = "1.0.4"
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }
tracing = "0.1"
errno = { version = "0.3.14", default-features = false }
instant = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = true

# Frame pacing in dev builds is dominated by unoptimized layout, text, render and
# syntax crates. These overrides keep `cargo run` representative; release builds
# (`opt-level = "z"`, lto) remain the reference for performance.
[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_wgpu = { opt-level = 3 }
gpui_macos = { opt-level = 3 }
taffy = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
naga = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[workspace.lints.clippy]
all = "deny"
perf = "deny"
unwrap_used = "deny"
