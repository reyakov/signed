[package]
name = "signed"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "signed"
path = "src/main.rs"

[package.metadata.packager]
name = "Signed"
product-name = "Signed"
description = "Nostr Git client for browsing repositories and collaborating"
identifier = "info.reya.signed"
category = "DeveloperTool"
version = "0.2.0"
out-dir = "../dist"
before-packaging-command = "cargo build --release"
resources = ["Cargo.toml", "src"]
icons = [
    "resources/32x32.png",
    "resources/128x128.png",
    "resources/128x128@2x.png",
    "resources/icon.icns",
    "resources/icon.ico",
]

[dependencies]
assets = { path = "../crates/assets" }
metadata = { path = "../crates/metadata" }
paths = { path = "../crates/paths" }
settings = { path = "../crates/settings" }
signed_app = { path = "../crates/signed_app" }
signed_state = { path = "../crates/signed_state" }

gpui.workspace = true
gpui_platform.workspace = true
gpui-native-kit.workspace = true
reqwest_client.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
